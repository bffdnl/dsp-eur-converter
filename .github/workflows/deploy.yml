name: Pubblica sito e aggiorna storico FMI
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 17 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica storico FMI (se disponibile)
        run: python scripts/update_history.py
      - name: Aggiorna tasso corrente (se disponibile)
        run: python scripts/update_rates.py || echo 'Tasso FMI corrente non aggiornabile'
      - name: Salva soltanto i dati verificati
        run: |
          if ! git diff --quiet -- history.json rates.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add history.json rates.json
            git commit -m 'Aggiorna tassi FMI'
            git pull --rebase origin main
            git push origin HEAD:main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
